name: AWS Emulator Infrastructure & App CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  AWS_REGION: "us-east-1"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_ENDPOINT_URL: "https://127.0.0.1:9297"
  AWS_DISABLE_HOST_PREFIX_INJECTION: "true"
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_PAGER: ""

jobs:
  validate-and-test:
    name: Emulator Provisioning, Integration & Bedrock Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Install AWS Emulator (.deb official package) & Start Daemon
        run: |
          curl -fLsS "https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest/aws-emulator-x86_64.deb" -o /tmp/aws-emulator.deb
          sudo apt-get update && sudo apt-get install -y /tmp/aws-emulator.deb
          ./scripts/start-emulator.sh
          echo "AWS_SHARED_CREDENTIALS_FILE=${HOME}/.aws/emulator/9297/emulator_credentials" >> "$GITHUB_ENV"
          echo "AWS_CONFIG_FILE=${HOME}/.aws/emulator/9297/config" >> "$GITHUB_ENV"
          echo "AWS_CA_BUNDLE=${HOME}/.aws/emulator/9297/ca.pem" >> "$GITHUB_ENV"
          echo "REQUESTS_CA_BUNDLE=${HOME}/.aws/emulator/9297/ca.pem" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=${HOME}/.aws/emulator/9297/ca.pem" >> "$GITHUB_ENV"

      - name: Verify Emulator Identity (STS)
        run: |
          aws sts get-caller-identity

      - name: Terraform Format, Init, Validate & Apply
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init
          terraform validate
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Install Python Dependencies & Run Integration Tests
        run: |
          pip install -r app/requirements.txt pytest==8.3.3
          pytest tests/test_integration.py -v

      - name: Execute Hybrid Amazon Bedrock Code Reviewer (Converse API)
        run: |
          python3 scripts/bedrock_reviewer.py

  static-security-audit:
    name: Static IAM & IaC Security Audit (Checkov)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scanner
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          skip_check: CKV_AWS_18,CKV_AWS_21,CKV_AWS_58,CKV_AWS_116,CKV_AWS_117,CKV_AWS_144,CKV_AWS_145,CKV_AWS_119,CKV_AWS_27,CKV_AWS_149,CKV2_AWS_11,CKV2_AWS_19,CKV2_AWS_61,CKV2_AWS_62
